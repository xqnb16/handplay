/* Motion atlas */

.motion-section { scroll-margin-top: 90px; }
.motion-index button:active, .motion-arrow:active { background: rgba(239,232,216,.12); }
@media (hover: hover) {
  .motion-index button:hover, .motion-arrow:hover { color: var(--bone); }
}
.motion-plate.is-previewed {
  opacity: .92;
  border-color: var(--cyan);
}
.motion-index button[data-preview] { color: var(--cyan); }
.motion-count { font-variant-numeric: tabular-nums; }
.motion-count[data-preview] { color: var(--cyan); }
.cam[data-hand-tracking="ready"] .dot { background: var(--cyan); }
@media (prefers-reduced-motion: no-preference) {
  .cam[data-hand-tracking="ready"] .dot {
    animation: atlas-tracking 300ms ease-out;
  }
}
@keyframes atlas-tracking {
  from { box-shadow: 0 0 0 4px color-mix(in srgb, var(--cyan) 35%, transparent); }
  to { box-shadow: 0 0 0 0 transparent; }
}
.motion-arrow:focus-visible, .motion-index button:focus-visible {
  outline: 2px solid var(--cyan);
  outline-offset: 2px;
}
@media (prefers-reduced-motion: no-preference) {
  .motion-section.atlas-reveal > h2,
  .motion-section.atlas-reveal > .sub,
  .motion-section.atlas-reveal > .motion-gallery {
    animation: atlas-rise 360ms cubic-bezier(.16,1,.3,1) both;
  }

  .motion-section.atlas-reveal > .sub { animation-delay: 35ms; }
  .motion-section.atlas-reveal > .motion-gallery {
    animation-name: atlas-gallery-reveal;
    animation-duration: 420ms;
    animation-delay: 65ms;
  }
  .stage .result .score { animation: atlas-rise 260ms cubic-bezier(.16,1,.3,1) both; }
  .stage .result .kv { animation: atlas-rise 260ms cubic-bezier(.16,1,.3,1) 55ms both; }
  #view[data-atlas-route="forward"]:not([data-atlas-figure]) .intro-card .intro-plate,
  #view[data-atlas-route="forward"] .intro-card h2 {
    animation: atlas-enter 260ms cubic-bezier(.16,1,.3,1) both;
  }
  #view[data-atlas-route="forward"] .intro-card .opts,
  #view[data-atlas-route="forward"] .intro-card .intro-actions {
    animation: atlas-rise 250ms cubic-bezier(.16,1,.3,1) 35ms both;
  }
  #view[data-atlas-route="back"] .motion-plate.is-highlighted .motion-copy,
  #view[data-atlas-route="back"]:not([data-atlas-figure]) .motion-plate.is-highlighted .motion-figure {
    animation: atlas-return 230ms cubic-bezier(.16,1,.3,1) both;
  }
}
@keyframes atlas-gallery-reveal {
  from { opacity: .75; clip-path: inset(0 0 8% 0 round 12px); }
  to { opacity: 1; clip-path: inset(0 0 0 0 round 12px); }
}
@keyframes atlas-rise { from { opacity: .5; transform: translateY(10px); } }
@keyframes atlas-enter { from { opacity: .55; transform: translateX(12px); } }
@keyframes atlas-return { from { opacity: .55; transform: translateX(-10px); } }
@media (max-width: 600px) {
  .motion-count { display: inline-block; }
}

/* HandPlay — the illustrated atlas in motion */
.atlas-hero .specimen {
  isolation: isolate;
  overflow: hidden;
  border-color: color-mix(in srgb, var(--cyan) 45%, transparent);
  background: radial-gradient(ellipse at 54% 47%, #194876 0%, #10284f 54%, #091831 100%);
}
.atlas-hero .specimen canvas { z-index: 1; }
.atlas-hero .specimen .meta { z-index: 3; }
.atlas-hero .specimen::after {
  content: "";
  position: absolute;
  inset: 9%;
  z-index: 0;
  pointer-events: none;
  border-radius: 50%;
  background: repeating-radial-gradient(circle at center, transparent 0 32px, #69d9f030 33px 34px);
  mask-image: radial-gradient(circle, #000 45%, transparent 72%);
}
.atlas-scanline {
  position: absolute;
  z-index: 2;
  inset: 0 0 auto;
  height: 56px;
  pointer-events: none;
  border-bottom: 1px solid #8beaffad;
  background: linear-gradient(0deg, #55d7fa2e, transparent);
  opacity: 0;
}
.atlas-hero .ctas .btn { transition: background-color .2s, color .2s, translate .24s, box-shadow .24s; }
.atlas-hero .ctas .btn:hover { translate: 0 -4px; box-shadow: 0 12px 24px #0005; }
.atlas-hero .ctas .btn:active { translate: 0 1px; }
.motion-plate { transition: opacity .42s var(--ease), scale .42s var(--ease), border-color .22s; }
.motion-plate:not(.is-highlighted) { scale: .93; opacity: .56; }
.motion-plate.is-previewed { scale: .98; opacity: .96; }
.motion-plate.is-highlighted { border-color: #83ddf18c; }
.motion-figure {
  overflow: hidden;
  background: radial-gradient(ellipse at 58% 56%, #143d65 0%, transparent 74%);
}
.motion-roman { color: #9ae9fa; font-size: clamp(42px, 7vw, 104px); opacity: .72; }
.motion-count { padding: 3px 6px; margin-inline: -6px 1px; border-radius: 3px; }
.motion-count[data-preview] {
  background: #79e1f5;
  color: #081b33;
}
@media (prefers-reduced-motion: no-preference) {
  .atlas-hero h1 { animation: atlas-title .9s cubic-bezier(.16,1,.3,1) both; }
  .atlas-hero .specimen { animation: atlas-open .95s cubic-bezier(.16,1,.3,1) backwards; }
  .atlas-hero .specimen canvas {
    translate: var(--atlas-x, 0px) var(--atlas-y, 0px);
    transition: translate 360ms cubic-bezier(.16,1,.3,1);
  }
  .atlas-hero .specimen::after {
    translate: var(--atlas-x, 0px) var(--atlas-y, 0px);
    transition: translate 500ms cubic-bezier(.16,1,.3,1);
  }
  .atlas-scanline { animation: atlas-scan 2.4s cubic-bezier(.28,.65,.35,1) .38s both; }
  .motion-section.atlas-reveal > .motion-gallery {
    animation: atlas-open .74s cubic-bezier(.16,1,.3,1) 85ms backwards;
  }
  @supports (animation-timeline: view()) {
    .atlas-hero > div:first-child { animation: atlas-hero-scroll linear both; animation-timeline: view(); animation-range: exit 0% exit 90%; }
    .numbers b, .atlas-protocol .steps div {
      animation: atlas-scroll-reveal linear both;
      animation-timeline: view();
      animation-range: entry 0% entry 88%;
    }
    body:has(.atlas-hero) #bg {
      animation: atlas-map-drift linear both;
      animation-timeline: scroll(root);
      animation-range: 0% 82%;
    }
  }
}
@keyframes atlas-title {
  from { opacity: .2; translate: 0 44px; clip-path: inset(0 0 95% 0); }
  to { opacity: 1; translate: 0 0; clip-path: inset(-12% -12% -20% -12%); }
}
@keyframes atlas-open {
  from { opacity: .38; clip-path: inset(18% 7% 18% 7% round 16px); }
  to { opacity: 1; clip-path: inset(0 round 12px); }
}
@keyframes atlas-scan {
  0% { top: 7%; opacity: 0; }
  15% { opacity: .9; }
  78% { opacity: .7; }
  100% { top: 88%; opacity: 0; }
}
@keyframes atlas-hero-scroll { to { translate: 0 -68px; opacity: .32; } }
@keyframes atlas-scroll-reveal { from { translate: 0 34px; opacity: .35; } }
@keyframes atlas-map-drift {
  from { transform: scale(1.04); }
  to { transform: translate(-3%, -2%) scale(1.18) rotate(-3deg); }
}
